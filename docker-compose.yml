# bid4 — local stack.
#
#   docker compose up -d                  infrastructure only (fast)
#   docker compose --profile app up -d    infrastructure + the API container
#
# Every published port is bound to 127.0.0.1: the databases are reachable from
# this machine and from the compose network, never from the LAN.

name: bid4

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # scram-sha-256 rather than md5, for host and local connections alike.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  redis:
    <<: *hardening
    image: redis:7-alpine
    # Rate limiting is the reason Redis is here, so it must survive a restart
    # with its counters intact: appendonly, not the default snapshotting.
    # The healthcheck runs redis-cli inside this container, so it needs the
    # password in the environment too, not only on the server's command line.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384m

  minio:
    <<: *hardening
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # Creates the two buckets and exits. Neither bucket takes an anonymous policy:
  # every object is handed out as a short-lived presigned URL by the API, which
  # is what keeps an identity document from becoming a public link.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
    entrypoint: >
      /bin/sh -c "
      mc alias set bid4 http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing bid4/$${MINIO_BUCKET_PUBLIC} &&
      mc mb --ignore-existing bid4/$${MINIO_BUCKET_PRIVATE} &&
      mc anonymous set none bid4/$${MINIO_BUCKET_PUBLIC} &&
      mc anonymous set none bid4/$${MINIO_BUCKET_PRIVATE} &&
      mc version enable bid4/$${MINIO_BUCKET_PRIVATE} &&
      echo 'buckets ready'
      "
    restart: "no"

  backend:
    <<: *hardening
    profiles: ["app"]
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      BID4_JWT_SECRET: ${BID4_JWT_SECRET}
      BID4_CORS_ORIGINS: ${BID4_CORS_ORIGINS}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    name: bid4-net
