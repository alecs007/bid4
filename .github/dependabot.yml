version: 2

# Trivy reports a dependency with a published CVE; nothing in CI moves it.
# These updates are the other half of that: the report has somewhere to go.
#
# Weekly rather than daily, and grouped, because a pull request per package on
# a Spring Boot and Next.js tree is a queue nobody reads.
#
# Majors are ignored everywhere except GitHub Actions. A major is a migration
# note to read and a build to verify, not something to arrive unbidden on a
# Monday — and left on, they do arrive: the first run here proposed temurin 25
# under a Java 21 build, minio 9, spotless 3, typescript 6 and @types/node 26
# in one morning, one of which failed CI by construction.
#
# This does not weaken the CVE position, because Dependabot was never what
# held it. security.yml runs Trivy on every push and weekly, with
# `exit-code: 1` over CRITICAL and HIGH findings that have a released fix. If
# the only fix for an advisory is a major, the build goes red and the upgrade
# gets made deliberately, which is the right way round for a change that large.
#
# GitHub Actions is the exception, and deliberately so: an action's major is
# how a runner retirement reaches you. Node 20 left the runners in September
# 2026 and every action pinned here declared it — majors are the only warning
# that arrives before CI simply stops working.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      backend-patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      frontend-patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Covers what was listed here individually before: next, react and
      # react-dom are pinned to exact versions, eslint-config-next must match
      # next, and @types/node types against the Node the workflow installs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # The base image is Java 21 because the project targets Java 21
      # (`<java.version>` in pom.xml). A major bump moves the JDK out from
      # under the build — temurin 25 fails the image job outright — so the
      # runtime moves when the project does, not when a tag appears.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
