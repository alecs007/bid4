name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm present to resolve its cache.
      #
      # package_json_file is required: an action step runs at the repository
      # root regardless of defaults.run.working-directory, which only applies to
      # `run:` steps. Without it the action looks for package.json beside the
      # workflow's checkout, finds none, and fails with "No pnpm version is
      # specified". The version itself still comes from the packageManager
      # field, so it is stated in one place.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile fails rather than silently resolving something new,
      # so CI installs exactly what a developer installed.
      - name: install
        run: pnpm install --frozen-lockfile

      # PageProps and LayoutProps are generated, not hand-written. They land in
      # .next/types, which tsconfig includes — so on a clean checkout, where no
      # dev server has ever run, tsc cannot resolve them. `next build` would
      # generate them, but it runs after the typecheck; typegen does the same
      # job without building.
      - name: generate route types
        run: pnpm exec next typegen

      - name: typecheck
        run: pnpm exec tsc --noEmit

      # Zero warnings: one is either worth fixing or worth silencing at its
      # line with a reason. Leaving one standing spends the budget that would
      # have made the next one visible.
      - name: lint
        run: pnpm exec eslint src --max-warnings=0

      # Catches what tsc cannot — a server/client boundary crossed, a bad route
      # export, a component that only fails when it is actually rendered.
      # Before the build: a failing unit test should stop the run at the cheapest
      # point, not after a full production compile.
      - name: test
        run: pnpm exec vitest run

      - name: build
        run: pnpm exec next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
