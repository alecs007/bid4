name: codeql

# Code scanning is free on public repositories, which is what makes this
# workflow possible at all: the analysis always ran, but uploading its results
# needs GitHub code scanning, and on a private repository that is part of
# GitHub Advanced Security. See backend/ARCHITECTURE.md for the history.
#
# Trivy in security.yml covers dependencies and committed secrets. CodeQL
# covers what neither can see — a taint path through this project's own code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A query pack updated after the last commit finds nothing until something is
  # pushed, so the schedule is what keeps the analysis current.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A job-level permissions block REPLACES the workflow-level default rather
    # than merging with it, so `contents: read` has to be restated here —
    # without it the token cannot read the repository and checkout fails with
    # "repository not found" before CodeQL ever runs.
    permissions:
      contents: read
      # Uploading the SARIF results. The only job in this repository that needs
      # more than read.
      security-events: write
      # Both are in GitHub's own CodeQL template: packages to fetch CodeQL
      # packs, actions to read workflow run metadata.
      packages: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      # Before init, so CodeQL traces the compiler the project actually builds
      # with. The runner's default JDK is 17, and the build sets release 21 —
      # without this, javac rejects it as "release version 21 not supported"
      # long before any analysis happens. backend.yml sets the same version for
      # the same reason.
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # autobuild would have to discover that the Maven project lives in
      # backend/ rather than at the root. Naming the build is one line and
      # removes the guess; -DskipTests because backend.yml already runs the
      # suite and CodeQL only needs the classes.
      - name: build
        if: matrix.build-mode == 'manual'
        run: ./mvnw -B --no-transfer-progress -DskipTests compile
        working-directory: backend

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
