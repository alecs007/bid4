name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-related, do not open an issue —
        [report it privately](https://github.com/alecs007/bid4/security/advisories/new).
        See [SECURITY.md](https://github.com/alecs007/bid4/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual result, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as maria@bid4.ro
        2. Open /licitatii and make an offer of 150 lei
        3. ...
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which data layer were you running against?
      description: >
        The web application serves a seeded dataset unless NEXT_PUBLIC_USE_MOCK
        is false. Which one it was narrows the bug to one half of the codebase.
      options:
        - Mock — NEXT_PUBLIC_USE_MOCK=true (the default)
        - Live API — NEXT_PUBLIC_USE_MOCK=false
        - Backend only, no browser involved
        - Not sure
    validations:
      required: true

  - type: input
    id: request-id
    attributes:
      label: X-Request-Id
      description: >
        Every API response carries one, and it appears in the server log for the
        same request. If a response failed, paste its value here.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24.04
        Browser: Firefox 140
        Java: 21.0.5 (`java -version`)
        pnpm: 10.16.1 (`pnpm --version`)
        Commit: the output of `git rev-parse --short HEAD`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Paste the relevant part rather than the whole log.
      render: shell
