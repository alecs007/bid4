spring:
  application:
    name: bid4-backend

  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:bid4}
    username: ${POSTGRES_USER:bid4}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        shutdown-timeout: 200ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
        transport:
          protocol: smtp

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
    factory:
      constraints:
        read:
          max-document-length: 1048576
          max-nesting-depth: 32
          max-string-length: 200000
          max-name-length: 256
          max-token-count: 100000

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 24MB

  threads:
    virtual:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  max-http-request-header-size: 16KB
  tomcat:
    remoteip:
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100
    connection-timeout: 5s
    max-http-form-post-size: 256KB
    max-swallow-size: 2MB

management:
  server:
    port: 8081
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true

bid4:
  jwt:
    secret: ${BID4_JWT_SECRET:}
    issuer: bid4
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    absolute-refresh-ttl: 90d
    refresh-token-retention: 30d
  cors:
    allowed-origins: ${BID4_CORS_ORIGINS:http://localhost:3000}
  cookies:
    require-secure: true
  storage:
    endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    public-bucket: ${MINIO_BUCKET_PUBLIC:bid4-public}
    private-bucket: ${MINIO_BUCKET_PRIVATE:bid4-private}
    public-url-ttl: 12h
    private-url-ttl: 5m
  security:
    max-failed-logins: 5
    lockout-duration: 15m
  mail:
    from: ${MAIL_FROM:bid4 <noreply@bid4.ro>}
    web-base-url: ${BID4_WEB_BASE_URL:http://localhost:3000}
  verification:
    token-ttl: 24h
    resend-cooldown: 2m
  rate-limit:
    enabled: true
    auth:
      capacity: 10
      window: 15m
    refresh:
      capacity: 60
      window: 5m
    write:
      capacity: 60
      window: 1m
    read:
      capacity: 300
      window: 1m

logging:
  level:
    root: INFO
    ro.bid4.backend: INFO
